name: Keep Streamlit App Awake

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows you to run it manually from the GitHub website if needed

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          curl -sL "https://korean23.streamlit.app/" > /dev/null
          echo "Ping successful!"